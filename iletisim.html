<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#e50914">
<title>İletişim | İonenSpiegel</title>
<meta name="description" content="İonenSpiegel iletişim sayfası. Görüş, öneri, iş birliği ve hata bildirimleri için mesaj gönder.">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="stylesheet" href="style.css?v=58">
<link rel="stylesheet" href="iletisim-v2.css?v=2">
<script src="./ga4.js?v=64" defer></script>
</head>
<body>
<main class="contact-page">
  <div class="contact-wrap">
    <header class="contact-header">
      <a class="contact-back" href="index.html" aria-label="Ana sayfaya dön">‹</a>
      <a class="contact-logo" href="index.html"><span>İonen</span>Spiegel</a>
    </header>

    <section class="contact-hero">
      <div class="contact-kicker">İONENSPIEGEL</div>
      <h1>İletişim</h1>
      <p>Görüş, öneri, iş birliği veya tüm soruların için bize ulaşabilirsin.</p>
    </section>

    <section class="contact-card">
      <div class="contact-info">
        <strong>Mesajını gönder</strong>
        <span>Formu doldur. Mesajın İonenSpiegel iletişim sistemine iletilsin.</span>
      </div>

      <form id="contactForm" novalidate>
        <label>Adın
          <input id="contactName" name="name" maxlength="60" autocomplete="name" placeholder="Adını gir" required>
        </label>

        <label>E-posta adresin
          <input id="contactEmail" name="email" type="email" maxlength="120" autocomplete="email" placeholder="ornek@mail.com" required>
        </label>

        <label>Konu
          <select id="contactSubject" name="subject" required>
            <option value="">Konu seç</option>
            <option>Görüş</option>
            <option>Öneri</option>
            <option>Hata bildirimi</option>
            <option>İş birliği</option>
            <option>Diğer</option>
          </select>
        </label>

        <label>Mesajın
          <textarea id="contactMessage" name="message" maxlength="2000" placeholder="Mesajını buraya yaz..." required></textarea>
        </label>

        <input id="contactWebsite" class="contact-hp" tabindex="-1" autocomplete="off" aria-hidden="true">

        <button id="contactSubmit" type="submit">✈ Mesajı Gönder</button>
        <div id="contactStatus" class="contact-status" aria-live="polite"></div>
      </form>

      <div class="contact-note">Mesaj gönderildikten sonra kısa bir onay mesajı göreceksin.</div>
    </section>

    <a class="contact-home" href="index.html">← Ana sayfaya dön</a>
  </div>
</main>

<script>
(function(){
  const API = "https://script.google.com/macros/s/AKfycbxoTMojRbXgNWBkFqSvYXULBRkT1C30nOZdh4luZmLqe_FZ55U3Vv1O2CExgoumeaFy_Q/exec";
  const form = document.getElementById("contactForm");
  const btn = document.getElementById("contactSubmit");
  const status = document.getElementById("contactStatus");
  const hp = document.getElementById("contactWebsite");

  form.addEventListener("submit", function(e){
    e.preventDefault();

    const name = document.getElementById("contactName").value.trim();
    const email = document.getElementById("contactEmail").value.trim();
    const subject = document.getElementById("contactSubject").value;
    const message = document.getElementById("contactMessage").value.trim();

    status.className = "contact-status";
    status.textContent = "";

    if (hp.value) return;
    if (!name || !email || !subject || !message) {
      status.className = "contact-status error";
      status.textContent = "Lütfen tüm alanları doldur.";
      return;
    }
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
      status.className = "contact-status error";
      status.textContent = "Geçerli bir e-posta adresi yaz.";
      return;
    }
    if (message.length < 5) {
      status.className = "contact-status error";
      status.textContent = "Mesajın biraz daha uzun olsun.";
      return;
    }

    btn.disabled = true;
    btn.textContent = "Gönderiliyor…";

    // Mevcut İonenSpiegel Apps Script topluluk endpoint'inin
    // doğrulanmış e-posta bildirim mekanizmasını kullanır.
    const payload =
      "action=yorum" +
      "&name=" + encodeURIComponent("İLETİŞİM | " + name + " | " + email) +
      "&text=" + encodeURIComponent(
        "Konu: " + subject + "\n" +
        "E-posta: " + email + "\n\n" +
        message
      );

    fetch(API, {
      method: "POST",
      mode: "no-cors",
      headers: {"Content-Type":"application/x-www-form-urlencoded;charset=UTF-8"},
      body: payload
    }).then(function(){
      status.className = "contact-status success";
      status.textContent = "Mesaj gönderim isteği alındı. Teşekkürler.";
      form.reset();
    }).catch(function(){
      status.className = "contact-status error";
      status.textContent = "Mesaj gönderilemedi. Tekrar dene.";
    }).finally(function(){
      btn.disabled = false;
      btn.textContent = "✈ Mesajı Gönder";
    });
  });
})();
</script>
</body>
</html>

<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#e50914">
<title>İonenSpiegel | İletişim</title>
<style>
:root{--red:#e50914;--bg:#f4f4f2;--card:#fff;--text:#17191d;--muted:#70757d;--line:#dfe2e6}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,Arial,sans-serif}
.wrap{max-width:760px;margin:auto;padding:18px}.top{height:62px;display:flex;align-items:center;gap:12px}
.back{text-decoration:none;color:var(--text);font-size:28px;width:42px}.brand{font-size:27px;font-weight:900}.brand span{font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px;box-shadow:0 10px 30px #0000000d}
.hero{display:flex;gap:16px;align-items:center;margin-bottom:20px}.icon{width:64px;height:64px;border-radius:17px;background:var(--red);color:white;display:grid;place-items:center;font-size:32px;flex:none}
h1{margin:0 0 4px;font-size:32px}.sub{margin:0;color:var(--muted)}.info{background:#f7f8fa;border:1px solid var(--line);border-radius:15px;padding:15px;line-height:1.55;margin-bottom:20px}
label{display:block;font-weight:800;margin:15px 0 7px}input,select,textarea{width:100%;border:1px solid #cfd4da;border-radius:13px;padding:13px 14px;font:inherit;background:white;color:var(--text);outline:none}textarea{min-height:150px;resize:vertical}input:focus,select:focus,textarea:focus{border-color:var(--red);box-shadow:0 0 0 3px #e5091420}
button{width:100%;border:0;border-radius:13px;background:var(--red);color:#fff;font-weight:900;font-size:16px;padding:14px;margin-top:18px;cursor:pointer}button:disabled{opacity:.65}
.status{margin-top:13px;text-align:center;font-weight:700;min-height:22px}.success{color:#16864a}.error{color:#c51d28}
@media(prefers-color-scheme:dark){body{background:#111419;color:#f3f5f7}.back{color:#f3f5f7}.card{background:#171b21;border-color:#2c323b;box-shadow:none}.info{background:#111419;border-color:#2c323b}input,select,textarea{background:#111419;color:#f3f5f7;border-color:#343b46}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top"><a class="back" href="./index.html" aria-label="Geri">‹</a><div class="brand"><span>İonen</span>Spiegel</div></header>
  <main class="card">
    <div class="hero"><div class="icon">✉</div><div><h1>İletişim</h1><p class="sub">Bizimle iletişime geçin</p></div></div>
    <div class="info">Görüş, öneri, iş birliği veya tüm sorularınız için bize ulaşabilirsiniz. Mesajınız doğrudan site yönetimine iletilir.</div>
    <form id="contactForm">
      <label for="name">Adınız</label><input id="name" name="name" required maxlength="60" placeholder="Adınızı girin">
      <label for="email">E-posta adresiniz</label><input id="email" name="email" type="email" required maxlength="120" placeholder="ornek@mail.com">
      <label for="subject">Konu</label>
      <select id="subject" name="subject" required><option value="">Konu seçin</option><option>Görüş / öneri</option><option>Haber düzeltmesi</option><option>İş birliği</option><option>Diğer</option></select>
      <label for="message">Mesajınız</label><textarea id="message" name="message" required maxlength="2000" placeholder="Mesajınızı buraya yazın..."></textarea>
      <button id="send" type="submit">✈ Mesajı Gönder</button>
      <div id="status" class="status" aria-live="polite"></div>
    </form>
  </main>
</div>
<script>
const API='https://script.google.com/macros/s/AKfycbxoTMojRbXgNWBkFqSvYXULBRkT1C30nOZdh4luZmLqe_FZ55U3Vv1O2CExgoumeaFy_Q/exec';
const form=document.getElementById('contactForm');
const status=document.getElementById('status');
const send=document.getElementById('send');
form.addEventListener('submit',function(e){
  e.preventDefault();
  const data=new FormData(form);
  if(!data.get('name')||!data.get('email')||!data.get('subject')||!data.get('message')) return;
  send.disabled=true; status.className='status'; status.textContent='Mesaj gönderiliyor...';
  const body='action=iletisim'
    +'&name='+encodeURIComponent(data.get('name'))
    +'&email='+encodeURIComponent(data.get('email'))
    +'&subject='+encodeURIComponent(data.get('subject'))
    +'&message='+encodeURIComponent(data.get('message'));
  fetch(API,{method:'POST',mode:'no-cors',headers:{'Content-Type':'application/x-www-form-urlencoded;charset=UTF-8'},body})
    .then(()=>{form.reset();status.className='status success';status.textContent='Mesajın gönderildi. Teşekkürler.';})
    .catch(()=>{status.className='status error';status.textContent='Mesaj gönderilemedi. Lütfen tekrar dene.';})
    .finally(()=>{send.disabled=false;});
});
</script>
</body>
</html>

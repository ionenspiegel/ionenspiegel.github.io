</head><body><header class="topbar"><div class="top-inner"><a class="brand" href="index.html">İonenSpiegel</a></div></header><main class="container contact-page"><section class="content-card contact-box"><span class="tag news">İLETİŞİM</span><h1 style="font-family:'Barlow Condensed';font-size:42px;margin:12px 0">Bizimle iletişime geç</h1><p style="line-height:1.7;color:var(--muted)">Görüş, öneri, düzeltme, iş birliği veya siteyle ilgili soruların için mesaj gönderebilirsin. Mesajlar Google Apps Script üzerinden işlenir.</p><form id="contactForm" class="contact-form" novalidate><div class="contact-grid"><label>Adınız<input id="contactName" name="name" autocomplete="name" maxlength="80" placeholder="Adınızı girin" required></label><label>E-posta adresiniz<input id="contactEmail" name="email" type="email" autocomplete="email" maxlength="120" placeholder="ornek@mail.com" required></label></div><label>Konu<select id="contactSubject" name="subject" required><option value="">Konu seçin</option><option>Haber / Düzeltme</option><option>Öneri</option><option>İş birliği</option><option>Diğer</option></select></label><label>Mesajınız<textarea id="contactMessage" name="message" rows="7" maxlength="2000" placeholder="Mesajınızı buraya yazın..." required></textarea></label><button class="primary-btn" type="submit">✈ Mesajı Gönder</button><p id="contactStatus" class="muted" aria-live="polite"></p></form><a href="index.html" style="display:inline-block;margin-top:18px;color:#e50914;font-weight:900;text-decoration:none">← Ana sayfaya dön</a></section></main><script>window.IONENSPIEGEL_COMMUNITY_API="https://script.google.com/macros/s/AKfycbxoTMojRbXgNWBkFqSvYXULBRkT1C30nOZdh4luZmLqe_FZ55U3Vv1O2CExgoumeaFy_Q/exec";</script><script id="v69-contact-form">(function(){const f=document.getElementById('contactForm'),api=window.IONENSPIEGEL_COMMUNITY_API,s=document.getElementById('contactStatus');if(!f)return;f.addEventListener('submit',e=>{e.preventDefault();const n=document.getElementById('contactName').value.trim(),em=document.getElementById('contactEmail').value.trim(),k=document.getElementById('contactSubject').value.trim(),m=document.getElementById('contactMessage').value.trim();if(!n||!em||!k||!m){s.textContent='Lütfen tüm alanları doldur.';return}if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em)){s.textContent='Geçerli bir e-posta adresi gir.';return}const body='action=iletisim&name='+encodeURIComponent(n)+'&email='+encodeURIComponent(em)+'&konu='+encodeURIComponent(k)+'&subject='+encodeURIComponent(k)+'&message='+encodeURIComponent(m)+'&text='+encodeURIComponent(m);s.textContent='Mesaj gönderiliyor...';fetch(api,{method:'POST',mode:'no-cors',headers:{'Content-Type':'application/x-www-form-urlencoded;charset=UTF-8'},body}).then(()=>{f.reset();s.textContent='Mesajın gönderildi. Teşekkürler.'}).catch(()=>{s.textContent='Mesaj gönderilemedi. Lütfen tekrar dene.'})})})();</script></body></html>
